<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW NEXUS 3D - P2P Serverless Edition</title>
    <!-- PeerJS for Serverless P2P Networking -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #050508;
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            width: 1280px;
            height: 720px;
            position: relative;
            background: radial-gradient(circle at center, #1a1a2e 0%, #080810 100%);
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), inset 0 0 100px rgba(0,0,0,0.8);
            border: 2px solid #2a2a40;
        }

        /* SCREENS */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(5, 5, 8, 0.95);
            z-index: 10;
            transition: opacity 0.4s ease;
        }

        .hidden {
            display: none !important;
        }

        h1.title {
            font-size: 4rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ff2a5f, #ff9e00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 42, 95, 0.5);
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #8888aa;
            font-size: 1.1rem;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .menu-box {
            background: #11111a;
            border: 1px solid #2a2a40;
            padding: 30px;
            border-radius: 12px;
            width: 450px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            background: #1a1a26;
            border: 1px solid #3a3a5c;
            color: #fff;
            border-radius: 6px;
            font-size: 1rem;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 1px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #ff2a5f;
            box-shadow: 0 0 10px rgba(255, 42, 95, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, #ff2a5f, #d4145a);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 42, 95, 0.4);
            margin-bottom: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 42, 95, 0.6);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #2a2a40, #1a1a2e);
            border: 1px solid #4a4a7c;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #3a3a5c, #2a2a40);
            box-shadow: 0 4px 15px rgba(100, 100, 150, 0.3);
        }

        /* CHARACTER SELECT GRID */
        #char-select-screen {
            padding: 40px;
        }

        .char-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            max-width: 1000px;
            margin-bottom: 30px;
        }

        .char-card {
            background: #11111a;
            border: 2px solid #2a2a40;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .char-card:hover, .char-card.selected {
            border-color: #ff2a5f;
            background: #1a1a2e;
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(255, 42, 95, 0.4);
        }

        .char-avatar {
            width: 70px;
            height: 70px;
            background: #080810;
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            border: 2px solid #3a3a5c;
        }

        .char-name {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .char-stats {
            font-size: 0.75rem;
            color: #8888aa;
        }

        /* 3D ARENA & HUD */
        #arena {
            position: relative;
            width: 100%;
            height: 100%;
            perspective: 1000px;
            transform-style: preserve-3d;
            background: linear-gradient(to bottom, #0d0d1a 0%, #030307 70%, #111118 100%);
        }

        /* Cinematic Background Elements */
        .arena-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 50% 30%, rgba(50, 20, 80, 0.3) 0%, transparent 70%),
                repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,0.01) 40px, rgba(255,255,255,0.01) 41px);
        }

        .arena-floor {
            position: absolute;
            bottom: 0;
            width: 200%;
            left: -50%;
            height: 280px;
            background: linear-gradient(to bottom, #12121f 0%, #050508 100%);
            transform: rotateX(65deg);
            transform-origin: bottom center;
            border-top: 2px solid #ff2a5f;
            box-shadow: inset 0 20px 40px rgba(0,0,0,0.9);
        }

        /* HUD */
        .hud {
            position: absolute;
            top: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 50px;
            z-index: 5;
            pointer-events: none;
        }

        .fighter-hud {
            width: 45%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .fighter-hud.right {
            align-items: flex-end;
        }

        .hud-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .health-bar-container {
            width: 100%;
            height: 26px;
            background: #11111a;
            border: 2px solid #3a3a5c;
            border-radius: 4px;
            overflow: hidden;
            padding: 2px;
        }

        .health-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff2a5f, #ff7000);
            width: 100%;
            transition: width 0.1s ease-out;
            border-radius: 2px;
        }

        .fighter-hud.right .health-bar {
            background: linear-gradient(90deg, #ff7000, #ff2a5f);
            margin-left: auto;
        }

        .stamina-bar-container {
            width: 60%;
            height: 8px;
            background: #11111a;
            border: 1px solid #2a2a40;
            border-radius: 2px;
            overflow: hidden;
        }

        .stamina-bar {
            height: 100%;
            background: #00f0ff;
            width: 100%;
            transition: width 0.05s linear;
        }

        .match-timer {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            background: #11111a;
            border: 2px solid #3a3a5c;
            padding: 5px 20px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* COMBAT FIGHTERS (DOM 3D SHADOW RENDERERS) */
        .fighter {
            position: absolute;
            bottom: 120px;
            width: 120px;
            height: 260px;
            transform-style: preserve-3d;
            transition: transform 0.05s linear;
            will-change: left, transform;
        }

        /* Shadow Silhouette Fighter Styling */
        .fighter-body {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-style: preserve-3d;
        }

        .fighter-head {
            width: 45px;
            height: 45px;
            background: #000;
            border: 2px solid var(--theme-color, #ff2a5f);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--theme-color, #ff2a5f);
            margin-bottom: 5px;
        }

        .fighter-torso {
            width: 70px;
            height: 110px;
            background: linear-gradient(135deg, #111, #000);
            border: 2px solid var(--theme-color, #ff2a5f);
            border-radius: 10px;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.1), 0 0 20px var(--theme-color, #ff2a5f);
            position: relative;
        }

        .fighter-limbs {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .limb {
            position: absolute;
            background: #000;
            border: 2px solid var(--theme-color, #ff2a5f);
            box-shadow: 0 0 10px var(--theme-color, #ff2a5f);
        }

        .arm-left, .arm-right {
            width: 16px;
            height: 80px;
            top: 55px;
            border-radius: 8px;
            transform-origin: top center;
        }

        .arm-left { left: -14px; }
        .arm-right { right: -14px; }

        .leg-left, .leg-right {
            width: 18px;
            height: 100px;
            top: 160px;
            border-radius: 8px;
            transform-origin: top center;
        }

        .leg-left { left: 20px; }
        .leg-right { right: 20px; }

        /* Fighter Floor Shadow */
        .fighter-shadow {
            position: absolute;
            bottom: -30px;
            left: 10px;
            width: 100px;
            height: 30px;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.8) 0%, transparent 70%);
            transform: rotateX(60deg);
        }

        /* Action Effects */
        .attack-effect {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--theme-color, #ff2a5f) 0%, transparent 70%);
            opacity: 0;
            pointer-events: none;
            transform: scale(0.5);
            transition: all 0.15s ease-out;
        }

        .attack-effect.active {
            opacity: 0.9;
            transform: scale(1.5);
        }

        /* Notification / Modal Overlays */
        #announcement {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 4rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 30px #ff2a5f, 0 0 60px #ff2a5f;
            z-index: 100;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        #announcement.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #666688;
            font-size: 0.9rem;
            letter-spacing: 1px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">

    <!-- MAIN MENU SCREEN -->
    <div id="menu-screen" class="screen">
        <h1 class="title">Shadow Nexus</h1>
        <p class="subtitle">Ultimate 3D Serverless P2P Combat</p>
        <div class="menu-box">
            <div id="connection-status" style="margin-bottom: 15px; font-size: 0.9rem; color: #ff9e00;">Initializing P2P Node...</div>
            <div style="margin-bottom: 15px;">
                <label style="font-size: 0.8rem; color: #aaa; display: block; margin-bottom: 5px;">YOUR UNIQUE ID</label>
                <input type="text" id="my-id-input" readonly placeholder="Generating ID...">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="font-size: 0.8rem; color: #aaa; display: block; margin-bottom: 5px;">FRIEND'S ID</label>
                <input type="text" id="friend-id-input" placeholder="Enter Friend's ID here">
            </div>
            <button class="btn" id="connect-btn">Connect & Challenge</button>
            <button class="btn btn-secondary" id="solo-btn">Practice vs AI</button>
        </div>
    </div>

    <!-- CHARACTER SELECT SCREEN -->
    <div id="char-select-screen" class="screen hidden">
        <h1 class="title" style="font-size: 2.5rem; margin-bottom: 20px;">Choose Your Fighter</h1>
        <div class="char-grid" id="char-grid">
            <!-- 10 Characters Injected via JS -->
        </div>
        <button class="btn" id="start-fight-btn" style="width: 300px;" disabled>Select a Fighter</button>
    </div>

    <!-- GAME ARENA SCREEN -->
    <div id="game-screen" class="screen hidden" style="justify-content: flex-start;">
        <div id="arena">
            <div class="arena-bg"></div>
            <div class="arena-floor"></div>

            <!-- HUD -->
            <div class="hud">
                <div class="fighter-hud left">
                    <div class="hud-info">
                        <span id="p1-name">Player 1</span>
                        <span id="p1-hp-text">1000/1000</span>
                    </div>
                    <div class="health-bar-container">
                        <div id="p1-hp" class="health-bar"></div>
                    </div>
                    <div class="stamina-bar-container">
                        <div id="p1-stamina" class="stamina-bar"></div>
                    </div>
                </div>
                <div class="match-timer" id="match-timer">99</div>
                <div class="fighter-hud right">
                    <div class="hud-info">
                        <span id="p2-name">Player 2</span>
                        <span id="p2-hp-text">1000/1000</span>
                    </div>
                    <div class="health-bar-container">
                        <div id="p2-hp" class="health-bar right"></div>
                    </div>
                    <div class="stamina-bar-container" style="margin-left: auto;">
                        <div id="p2-stamina" class="stamina-bar" style="margin-left: auto;"></div>
                    </div>
                </div>
            </div>

            <!-- FIGHTER 1 -->
            <div id="fighter1" class="fighter" style="left: 150px;">
                <div class="fighter-body" id="f1-body">
                    <div class="fighter-head" id="f1-head"></div>
                    <div class="fighter-torso" id="f1-torso">
                        <div class="fighter-limbs">
                            <div class="limb arm-left" id="f1-arm-l"></div>
                            <div class="limb arm-right" id="f1-arm-r"></div>
                            <div class="limb leg-left" id="f1-leg-l"></div>
                            <div class="limb leg-right" id="f1-leg-r"></div>
                        </div>
                    </div>
                </div>
                <div class="fighter-shadow"></div>
                <div class="attack-effect" id="f1-effect"></div>
            </div>

            <!-- FIGHTER 2 -->
            <div id="fighter2" class="fighter" style="right: 150px; left: auto;">
                <div class="fighter-body" id="f2-body">
                    <div class="fighter-head" id="f2-head"></div>
                    <div class="fighter-torso" id="f2-torso">
                        <div class="fighter-limbs">
                            <div class="limb arm-left" id="f2-arm-l"></div>
                            <div class="limb arm-right" id="f2-arm-r"></div>
                            <div class="limb leg-left" id="f2-leg-l"></div>
                            <div class="limb leg-right" id="f2-leg-r"></div>
                        </div>
                    </div>
                </div>
                <div class="fighter-shadow"></div>
                <div class="attack-effect" id="f2-effect"></div>
            </div>

            <div id="announcement">FIGHT!</div>
            <div class="controls-hint">A / D: Move | W: Jump | S: Block | J: Light Attack | K: Heavy Attack | L: Special Ability</div>
        </div>
    </div>

</div>

<script>
    /* GAME DATA & 10 CHARACTERS DEFINITION */
    const CHARACTERS = [
        { id: 0, name: "Umbra Blade", icon: "🗡️", color: "#ff2a5f", hp: 1000, speed: 6, dmg: 45 },
        { id: 1, name: "Kuro Samurai", icon: "⚔️", color: "#ff7000", hp: 1200, speed: 4.5, dmg: 65 },
        { id: 2, name: "Viper Strike", icon: "🐍", color: "#00ff66", hp: 900, speed: 7.5, dmg: 40 },
        { id: 3, name: "Iron Sentinel", icon: "🛡️", color: "#00f0ff", hp: 1400, speed: 3.5, dmg: 50 },
        { id: 4, name: "Spectre Mage", icon: "🔮", color: "#9d00ff", hp: 850, speed: 6.5, dmg: 55 },
        { id: 5, name: "Blood Fang", icon: "🦇", color: "#ff0055", hp: 950, speed: 6, dmg: 48 },
        { id: 6, name: "Void Monarch", icon: "🌀", color: "#00ffff", hp: 1050, speed: 5.5, dmg: 52 },
        { id: 7, name: "Solar Eclipse", icon: "☀️", color: "#ffcc00", hp: 1100, speed: 5, dmg: 58 },
        { id: 8, name: "Ghost Monk", icon: "🧘", color: "#aa88ff", hp: 1000, speed: 6, dmg: 46 },
        { id: 9, name: "Titan Fiend", icon: "👹", color: "#ff2222", hp: 1300, speed: 4, dmg: 70 }
    ];

    let peer = null;
    let conn = null;
    let isHost = false;
    let myPeerId = '';
    let selectedChar = null;
    let opponentChar = null;
    let gameMode = 'p2p'; // 'p2p' or 'ai'

    // Match State
    let matchActive = false;
    let p1 = { x: 200, y: 0, vx: 0, vy: 0, hp: 1000, maxHp: 1000, stamina: 100, facing: 1, blocking: stabbing = false, attacking: false, char: null };
    let p2 = { x: 960, y: 0, vx: 0, vy: 0, hp: 1000, maxHp: 1000, stamina: 100, facing: -1, blocking: false, attacking: false, char: null };
    let keys = {};
    let timer = 99;
    let timerInterval = null;

    // DOM Elements
    const menuScreen = document.getElementById('menu-screen');
    const charSelectScreen = document.getElementById('char-select-screen');
    const gameScreen = document.getElementById('game-screen');
    const myIdInput = document.getElementById('my-id-input');
    const friendIdInput = document.getElementById('friend-id-input');
    const connectBtn = document.getElementById('connect-btn');
    const soloBtn = document.getElementById('solo-btn');
    const connectionStatus = document.getElementById('connection-status');
    const charGrid = document.getElementById('char-grid');
    const startFightBtn = document.getElementById('start-fight-btn');
    const announcement = document.getElementById('announcement');

    // INITIALIZE PEERJS
    function initPeer() {
        peer = new Peer();
        peer.on('open', (id) => {
            myPeerId = id;
            myIdInput.value = id;
            connectionStatus.textContent = "P2P Node Ready. Share ID or Connect!";
            connectionStatus.style.color = "#00ff66";
        });

        peer.on('connection', (incomingConn) => {
            conn = incomingConn;
            isHost = false;
            setupConnection();
            connectionStatus.textContent = "Friend Connected! Choose Character.";
            setTimeout(() => goToCharSelect(), 1000);
        });

        peer.on('error', (err) => {
            connectionStatus.textContent = "Connection Error. Try refreshing.";
            connectionStatus.style.color = "#ff2a5f";
        });
    }

    function setupConnection() {
        conn.on('data', (data) => {
            handleNetworkData(data);
        });
        conn.on('close', () => {
            alert("Opponent disconnected!");
            location.reload();
        });
    }

    connectBtn.addEventListener('click', () => {
        const friendId = friendIdInput.value.trim();
        if (!friendId) return alert("Please enter your friend's ID!");
        connectionStatus.textContent = "Connecting to Friend...";
        conn = peer.connect(friendId);
        isHost = true;
        setupConnection();
        conn.on('open', () => {
            connectionStatus.textContent = "Connected! Choose Character.";
            setTimeout(() => goToCharSelect(), 1000);
        });
    });

    soloBtn.addEventListener('click', () => {
        gameMode = 'ai';
        goToCharSelect();
    });

    // CHARACTER SELECTION SETUP
    function buildCharGrid() {
        charGrid.innerHTML = '';
        CHARACTERS.forEach(c => {
            const card = document.createElement('div');
            card.className = 'char-card';
            card.innerHTML = `
                <div class="char-avatar" style="border-color: ${c.color}">${c.icon}</div>
                <div class="char-name">${c.name}</div>
                <div class="char-stats">HP: ${c.hp}<br>DMG: ${c.dmg}</div>
            `;
            card.onclick = () => {
                document.querySelectorAll('.char-card').forEach(el => el.classList.remove('selected'));
                card.classList.add('selected');
                selectedChar = c;
                startFightBtn.disabled = false;
                startFightBtn.textContent = `Fight with ${c.name}`;
            };
            charGrid.appendChild(card);
        });
    }

    function goToCharSelect() {
        menuScreen.classList.add('hidden');
        charSelectScreen.classList.remove('hidden');
        buildCharGrid();
    }

    startFightBtn.addEventListener('click', () => {
        if (!selectedChar) return;
        p1.char = selectedChar;
        p1.hp = selectedChar.hp;
        p1.maxHp = selectedChar.hp;

        if (gameMode === 'p2p' && conn) {
            conn.send({ type: 'char-select', char: selectedChar });
            startFightBtn.textContent = "Waiting for Friend...";
            startFightBtn.disabled = true;
            checkBothReady();
        } else {
            // AI Mode opponent selection
            const randIdx = Math.floor(Math.random() * CHARACTERS.length);
            opponentChar = CHARACTERS[randIdx];
            p2.char = opponentChar;
            p2.hp = opponentChar.hp;
            p2.maxHp = opponentChar.hp;
            initGameArena();
        }
    });

    function checkBothReady() {
        if (selectedChar && opponentChar) {
            initGameArena();
        }
    }

    function handleNetworkData(data) {
        if (data.type === 'char-select') {
            opponentChar = data.char;
            p2.char = opponentChar;
            p2.hp = opponentChar.hp;
            p2.maxHp = opponentChar.hp;
            if (selectedChar) {
                conn.send({ type: 'char-select', char: selectedChar });
                initGameArena();
            }
        } else if (data.type === 'update-state') {
            if (!isHost) {
                // Sync P1 state from host
                p1.x = data.p1.x;
                p1.y = data.p1.y;
                p1.hp = data.p1.hp;
                p1.stamina = data.p1.stamina;
                p1.blocking = data.p1.blocking;
                p1.attacking = data.p1.attacking;
                p2.x = data.p2.x;
                p2.y = data.p2.y;
                p2.hp = data.p2.hp;
                p2.stamina = data.p2.stamina;
                p2.blocking = data.p2.blocking;
                p2.attacking = data.p2.attacking;
            }
        } else if (data.type === 'action') {
            if (isHost && data.action === 'attack') {
                // Handle client attack received on host
                triggerAttack(p2, p1);
            }
        }
    }

    // GAME ARENA START
    function initGameArena() {
        charSelectScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');

        // Apply visual themes
        document.getElementById('f1-body').style.setProperty('--theme-color', p1.char.color);
        document.getElementById('f2-body').style.setProperty('--theme-color', p2.char.color);
        document.getElementById('p1-name').textContent = p1.char.name;
        document.getElementById('p2-name').textContent = p2.char.name;

        matchActive = true;
        announcement.textContent = "FIGHT!";
        announcement.classList.add('show');
        setTimeout(() => announcement.classList.remove('show'), 1500);

        startTimer();
        requestAnimationFrame(gameLoop);
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            if (!matchActive) return;
            timer--;
            document.getElementById('match-timer').textContent = timer;
            if (timer <= 0) {
                endMatch(p1.hp >= p2.hp ? "Player 1 Wins on Time!" : "Player 2 Wins on Time!");
            }
        }, 1000);
    }

    // INPUT LISTENERS
    window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    // COMBAT ENGINE & LOOP
    function gameLoop() {
        if (!matchActive) return;

        updatePlayerPhysics();
        if (gameMode === 'ai') updateAI();
        updateHUD();
        renderFighters();

        if (gameMode === 'p2p' && isHost && conn) {
            conn.send({
                type: 'update-state',
                p1: { x: p1.x, y: p1.y, hp: p1.hp, stamina: p1.stamina, blocking: p1.blocking, attacking: p1.attacking },
                p2: { x: p2.x, y: p2.y, hp: p2.hp, stamina: p2.stamina, blocking: p2.blocking, attacking: p2.attacking }
            });
        }

        requestAnimationFrame(gameLoop);
    }

    function updatePlayerPhysics() {
        // P1 Controls (WASD + J/K/L)
        if (isHost || gameMode === 'ai') {
            if (keys['a']) { p1.x -= p1.char.speed; p1.facing = -1; }
            if (keys['d']) { p1.x += p1.char.speed; p1.facing = 1; }
            if (keys['w'] && p1.y === 0) { p1.vy = 16; } // Jump
            
            p1.blocking = keys['s'];

            if (keys['j'] && !p1.attacking && p1.stamina >= 15) {
                performAttack(p1, p2, p1.char.dmg, 'f1-effect');
                p1.stamina -= 15;
            }
            if (keys['k'] && !p1.attacking && p1.stamina >= 35) {
                performAttack(p1, p2, p1.char.dmg * 1.5, 'f1-effect');
                p1.stamina -= 35;
            }
        } else {
            // Client controls mapped to P2 in P2P mode
            if (keys['a']) { p2.x -= p2.char.speed; p2.facing = -1; }
            if (keys['d']) { p2.x += p2.char.speed; p2.facing = 1; }
            if (keys['w'] && p2.y === 0) { p2.vy = 16; }
            
            p2.blocking = keys['s'];

            if (keys['j'] && !p2.attacking && p2.stamina >= 15) {
                conn.send({ type: 'action', action: 'attack' });
                performAttack(p2, p1, p2.char.dmg, 'f2-effect');
                p2.stamina -= 15;
            }
        }

        // Gravity & Boundaries
        [p1, p2].forEach(p => {
            p.y += p.vy;
            if (p.y > 0) p.vy -= 1.2; // Gravity
            if (p.y <= 0) { p.y = 0; p.vy = 0; }

            // Arena bounds
            if (p.x < 50) p.x = 50;
            if (p.x > 1150) p.x = 1150;

            // Stamina regen
            if (p.stamina < 100) p.stamina += 0.5;
        });

        // Face each other
        if (p1.x < p2.x) { p1.facing = 1; p2.facing = -1; }
        else { p1.facing = -1; p2.facing = 1; }
    }

    function performAttack(attacker, defender, damage, effectId) {
        attacker.attacking = true;
        setTimeout(() => attacker.attacking = false, 250);

        // Visual effect trigger
        const fx = document.getElementById(effectId);
        fx.style.left = (attacker.x + (attacker.facing * 50)) + 'px';
        fx.style.bottom = (attacker.y + 80) + 'px';
        fx.classList.add('active');
        setTimeout(() => fx.classList.remove('active'), 150);

        // Collision check
        const dist = Math.abs(attacker.x - defender.x);
        if (dist < 110) {
            if (defender.blocking) {
                damage *= 0.2; // Block reduces 80% damage
            }
            defender.hp -= damage;
            if (defender.hp <= 0) {
                defender.hp = 0;
                endMatch(attacker === p1 ? "Player 1 Wins!" : "Player 2 Wins!");
            }
        }
    }

    function updateAI() {
        // Simple reactive AI for solo practice
        const dist = p1.x - p2.x;
        if (Math.abs(dist) > 90) {
            p2.x += (dist > 0 ? 1 : -1) * (p2.char.speed * 0.7);
        } else {
            if (Math.random() < 0.03 && !p2.attacking) {
                performAttack(p2, p1, p2.char.dmg, 'f2-effect');
            }
        }
    }

    function updateHUD() {
        document.getElementById('p1-hp').style.width = `${(p1.hp / p1.maxHp) * 100}%`;
        document.getElementById('p1-hp-text').textContent = `${Math.round(p1.hp)}/${p1.maxHp}`;
        document.getElementById('p1-stamina').style.width = `${p1.stamina}%`;

        document.getElementById('p2-hp').style.width = `${(p2.hp / p2.maxHp) * 100}%`;
        document.getElementById('p2-hp-text').textContent = `${Math.round(p2.hp)}/${p2.maxHp}`;
        document.getElementById('p2-stamina').style.width = `${p2.stamina}%`;
    }

    function renderFighters() {
        const f1El = document.getElementById('fighter1');
        const f2El = document.getElementById('fighter2');

        f1El.style.left = `${p1.x}px`;
        f1El.style.bottom = `${120 + p1.y}px`;
        f1El.style.transform = `scaleX(${p1.facing})`;

        f2El.style.left = `${p2.x}px`;
        f2El.style.bottom = `${120 + p2.y}px`;
        f2El.style.transform = `scaleX(${p2.facing})`;
    }

    function endMatch(msg) {
        matchActive = false;
        clearInterval(timerInterval);
        announcement.textContent = msg;
        announcement.classList.add('show');
        setTimeout(() => {
            location.reload();
        }, 3000);
    }

    // Run Peer init on load
    initPeer();
</script>

</body>
