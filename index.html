<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaP2P - Serverless Social</title>

  <!-- GunDB (P2P Decentralized Database) & PeerJS (WebRTC) -->
  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gun/sea.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons"></script>

  <style>
    :root {
      --bg-main: #000000;
      --card-bg: #121212;
      --card-hover: #1e1e1e;
      --border-color: #262626;
      --text-main: #f5f5f5;
      --text-muted: #a8a8a8;
      --accent-blue: #0095f6;
      --accent-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      --like-red: #ff3040;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    body { 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      overflow: hidden;
    }

    /* Main Container with Smooth Centered Framing */
    #app-container { 
      width: 100%; 
      max-width: 480px; 
      height: 100vh; 
      max-height: 920px; 
      display: flex; 
      flex-direction: column; 
      background-color: #050505; 
      border: 1px solid var(--border-color); 
      position: relative; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    @media (min-width: 520px) {
      #app-container { border-radius: 20px; height: 92vh; }
    }

    /* AUTH OVERLAY */
    .auth-overlay { 
      position: absolute; 
      inset: 0; 
      background: #000000; 
      z-index: 200; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      padding: 35px; 
    }
    .auth-logo { 
      font-size: 2.5rem; 
      font-weight: 800; 
      font-style: italic; 
      margin-bottom: 30px; 
      background: var(--accent-gradient); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
    }
    .auth-form { width: 100%; display: flex; flex-direction: column; gap: 14px; }
    .auth-input { 
      width: 100%; 
      padding: 14px 16px; 
      background: #1a1a1a; 
      border: 1px solid var(--border-color); 
      border-radius: 10px; 
      color: #fff; 
      outline: none; 
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }
    .auth-input:focus { border-color: var(--accent-blue); }
    .auth-btn { 
      width: 100%; 
      padding: 14px; 
      background: var(--accent-blue); 
      color: #fff; 
      border: none; 
      border-radius: 10px; 
      font-weight: bold; 
      font-size: 0.95rem; 
      cursor: pointer; 
      transition: opacity 0.2s;
    }
    .auth-btn:hover { opacity: 0.9; }

    /* HEADER */
    header { 
      height: 60px; 
      border-bottom: 1px solid var(--border-color); 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 0 18px; 
      background: rgba(5,5,5,0.85); 
      backdrop-filter: blur(10px); 
      z-index: 20; 
    }
    header h2 { 
      font-style: italic; 
      font-size: 1.6rem; 
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-icons { display: flex; gap: 18px; align-items: center; }

    /* VIEWPORT PANELS */
    main { flex: 1; overflow-y: auto; padding-bottom: 60px; scrollbar-width: none; }
    main::-webkit-scrollbar { display: none; }

    .panel { display: none; padding: 16px; min-height: 100%; }
    .panel.active { display: block; }

    /* FEED CARD */
    .post-card { 
      background: var(--card-bg); 
      border: 1px solid var(--border-color); 
      border-radius: 14px; 
      margin-bottom: 18px; 
      overflow: hidden; 
    }
    .post-header { display: flex; align-items: center; padding: 12px 14px; gap: 12px; }
    .avatar { 
      width: 38px; 
      height: 38px; 
      border-radius: 50%; 
      background: var(--accent-gradient); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: bold; 
      font-size: 1rem; 
      color: #fff; 
    }
    .post-username { font-weight: 600; font-size: 0.95rem; }
    .post-media { width: 100%; max-height: 480px; background: #000; object-fit: contain; display: block; }
    .post-actions { display: flex; gap: 18px; padding: 12px 14px 6px; }
    .action-icon { cursor: pointer; transition: transform 0.15s ease; color: var(--text-main); }
    .action-icon:active { transform: scale(0.8); }
    .post-likes { padding: 0 14px; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    .post-caption { padding: 0 14px 10px; font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
    .post-caption span { font-weight: 600; margin-right: 6px; }
    
    .post-comments { padding: 0 14px 10px; font-size: 0.85rem; color: var(--text-muted); }
    .comment-item { margin-top: 5px; color: var(--text-main); }
    .comment-item strong { margin-right: 6px; }

    /* SEARCH & USERS */
    .user-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: var(--card-bg); 
      padding: 12px 16px; 
      border-radius: 12px; 
      border: 1px solid var(--border-color);
      margin-bottom: 10px;
    }

    /* NOTIFICATION / REQUESTS MODAL */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      z-index: 150;
      display: none;
      flex-direction: column;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

    /* CREATE POST */
    .file-input-label { 
      border: 2px dashed var(--border-color); 
      padding: 40px 20px; 
      text-align: center; 
      border-radius: 12px; 
      cursor: pointer; 
      color: var(--text-muted); 
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #preview-container { width: 100%; max-height: 280px; overflow: hidden; border-radius: 12px; display: none; margin-bottom: 12px; }
    #preview-container img, #preview-container video { width: 100%; height: 100%; object-fit: cover; }

    /* CHAT OVERLAY */
    .chat-window { 
      display: none; 
      flex-direction: column; 
      position: absolute; 
      inset: 0; 
      background: #000; 
      z-index: 100; 
    }
    .chat-window.active { display: flex; }
    .chat-header { padding: 14px 18px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 14px; background: var(--card-bg); }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 78%; padding: 10px 16px; border-radius: 18px; font-size: 0.92rem; word-break: break-word; }
    .msg.sent { align-self: flex-end; background: var(--accent-blue); color: #fff; border-bottom-right-radius: 4px; }
    .msg.received { align-self: flex-start; background: var(--card-bg); border: 1px solid var(--border-color); color: #fff; border-bottom-left-radius: 4px; }
    .chat-input-bar { padding: 12px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; background: var(--card-bg); }

    /* BOTTOM NAV */
    nav { 
      height: 55px; 
      border-top: 1px solid var(--border-color); 
      display: flex; 
      justify-content: space-around; 
      align-items: center; 
      background: rgba(5,5,5,0.9); 
      backdrop-filter: blur(10px); 
      position: absolute; 
      bottom: 0; 
      width: 100%; 
      z-index: 20; 
    }
    nav .nav-item { cursor: pointer; color: var(--text-muted); transition: color 0.2s; }
    nav .nav-item.active { color: var(--text-main); }

    /* BUTTON STYLES */
    .btn-sm { padding: 8px 14px; background: var(--accent-blue); border: none; border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
    .btn-secondary { background: #262626; color: var(--text-main); border: 1px solid var(--border-color); }
    .badge { background: var(--like-red); color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.7rem; font-weight: bold; position: absolute; top: 12px; right: 40px; display: none; }
  </style>
</head>
<body>

<div id="app-container">
  
  <!-- AUTH MODAL -->
  <div class="auth-overlay" id="auth-modal">
    <div class="auth-logo">Instagram</div>
    <div class="auth-form">
      <input type="text" id="username-input" class="auth-input" placeholder="Choose unique username..." />
      <input type="password" id="password-input" class="auth-input" placeholder="Set password..." />
      <button class="auth-btn" id="auth-submit-btn" onclick="registerOrLogin()">Create Account / Login</button>
      <p id="auth-error" style="color:var(--like-red); font-size:0.85rem; text-align:center; display:none;"></p>
    </div>
  </div>

  <!-- HEADER -->
  <header>
    <h2>Instagram</h2>
    <div class="header-icons">
      <div style="position:relative;">
        <i data-feather="heart" class="action-icon" onclick="toggleRequestsModal()"></i>
        <span id="requests-badge" class="badge">0</span>
      </div>
      <i data-feather="send" class="action-icon" onclick="switchTab('chats')"></i>
    </div>
  </header>

  <!-- MAIN VIEWPORT -->
  <main id="main-content">
    
    <!-- FEED PANEL -->
    <div id="feed-panel" class="panel active">
      <div id="feed-container"></div>
    </div>

    <!-- SEARCH PANEL -->
    <div id="search-panel" class="panel">
      <div style="display:flex; gap:10px; margin-bottom:20px;">
        <input type="text" id="search-username" class="auth-input" placeholder="Search exact username..." />
        <button class="btn-sm" onclick="searchUser()">Search</button>
      </div>
      <div id="search-results"></div>
    </div>

    <!-- CREATE POST PANEL -->
    <div id="create-panel" class="panel">
      <div style="display:flex; flex-direction:column; gap:15px;">
        <label class="file-input-label" for="post-file">
          <i data-feather="image" style="width:36px; height:36px; color:var(--accent-blue);"></i>
          <p>Click to choose Photo or Video Reel</p>
        </label>
        <input type="file" id="post-file" accept="image/*,video/*" style="display:none;" onchange="handleFileSelect(event)">
        
        <div id="preview-container"></div>

        <input type="text" id="post-caption-input" class="auth-input" placeholder="Write a caption..." />
        <button class="auth-btn" onclick="publishPost()">Share Post</button>
      </div>
    </div>

    <!-- CHATS PANEL -->
    <div id="chats-panel" class="panel">
      <h3 style="margin-bottom:15px;">Direct Messages</h3>
      <div id="chat-friends-list"></div>
    </div>

    <!-- PROFILE PANEL -->
    <div id="profile-panel" class="panel">
      <div style="display:flex; align-items:center; gap:20px; margin-bottom:20px; background:var(--card-bg); padding:16px; border-radius:14px; border:1px solid var(--border-color);">
        <div class="avatar" id="profile-avatar" style="width:64px; height:64px; font-size:1.6rem;">U</div>
        <div>
          <h3 id="profile-name">Username</h3>
          <p style="color:var(--text-muted); font-size:0.85rem;" id="profile-handle">@username</p>
        </div>
      </div>
      <h4 style="margin-bottom:12px;">My Posts</h4>
      <div id="my-posts-grid" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:6px;"></div>
    </div>

  </main>

  <!-- NOTIFICATIONS / REQUESTS MODAL -->
  <div class="modal-overlay" id="requests-modal">
    <div class="modal-header">
      <h3>Follow Requests</h3>
      <i data-feather="x" class="action-icon" onclick="toggleRequestsModal()"></i>
    </div>
    <div id="requests-list" style="display:flex; flex-direction:column; gap:10px;"></div>
  </div>

  <!-- CHAT WINDOW OVERLAY -->
  <div class="chat-window" id="chat-window">
    <div class="chat-header">
      <i data-feather="arrow-left" class="action-icon" onclick="closeChat()"></i>
      <div class="avatar" id="chat-target-avatar">F</div>
      <strong id="chat-target-name">Friend</strong>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-bar">
      <input type="text" id="chat-msg-input" class="auth-input" placeholder="Message..." />
      <button class="btn-sm" onclick="sendDirectMessage()">Send</button>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <nav>
    <div class="nav-item active" onclick="switchTab('feed', this)"><i data-feather="home"></i></div>
    <div class="nav-item" onclick="switchTab('search', this)"><i data-feather="search"></i></div>
    <div class="nav-item" onclick="switchTab('create', this)"><i data-feather="plus-square"></i></div>
    <div class="nav-item" onclick="switchTab('chats', this)"><i data-feather="message-circle"></i></div>
    <div class="nav-item" onclick="switchTab('profile', this)"><i data-feather="user"></i></div>
  </nav>

</div>

<script>
  // Decentralized P2P Graph Database Network
  const gun = Gun({
    peers: ['https://gun-manhattan.herokuapp.com/gun', 'https://peer.wallrpc.com/gun']
  });

  let currentUser = null;
  let currentPeer = null;
  let selectedFileBase64 = null;
  let selectedFileType = null;
  let activeChatTarget = null;
  let activeDataConnection = null;

  feather.replace();

  // 1. STRICT UNIQUE USERNAME REGISTRATION & AUTH
  function registerOrLogin() {
    const name = document.getElementById('username-input').value.trim().toLowerCase();
    const pass = document.getElementById('password-input').value.trim();
    const errorEl = document.getElementById('auth-error');

    if (!name || !pass) {
      errorEl.innerText = "Please fill in all fields.";
      errorEl.style.display = 'block';
      return;
    }

    const userNode = gun.get('instap2p_v2_users').get(name);

    userNode.once((existingUser) => {
      if (existingUser && existingUser.passHash) {
        // User exists -> Validate Password
        if (existingUser.passHash !== btoa(pass)) {
          errorEl.innerText = "Username taken! Enter correct password or choose another name.";
          errorEl.style.display = 'block';
          return;
        }
      } else {
        // Register New Unique Account
        userNode.put({ username: name, passHash: btoa(pass), created: Date.now() });
      }

      // Success Login
      currentUser = name;
      localStorage.setItem('instap2p_user', name);
      document.getElementById('auth-modal').style.display = 'none';
      initPeerJS(name);
      setupProfile();
      listenToFeed();
      listenToFollowRequests();
    });
  }

  // Auto Login Check
  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('instap2p_user');
    if (saved) {
      currentUser = saved;
      document.getElementById('auth-modal').style.display = 'none';
      initPeerJS(saved);
      setupProfile();
      listenToFeed();
      listenToFollowRequests();
    }
  });

  // 2. WEBRTC DIRECT PEER ENGINE
  function initPeerJS(username) {
    currentPeer = new Peer('instap2p-' + username);

    currentPeer.on('connection', (conn) => {
      conn.on('data', (data) => {
        if (data.text && activeChatTarget === conn.peer.replace('instap2p-', '')) {
          renderMessage(data.text, 'received');
        }
      });
    });
  }

  // 3. NAVIGATION SWITCHING
  function switchTab(tabId, el) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    
    document.getElementById(tabId + '-panel').classList.add('active');
    if (el) el.classList.add('active');
  }

  function toggleRequestsModal() {
    const modal = document.getElementById('requests-modal');
    modal.classList.toggle('active');
  }

  // 4. SEARCH & FOLLOW REQUEST SYSTEM
  function searchUser() {
    const target = document.getElementById('search-username').value.trim().toLowerCase();
    const container = document.getElementById('search-results');
    container.innerHTML = '';

    if (!target || target === currentUser) return;

    gun.get('instap2p_v2_users').get(target).once((data) => {
      if (!data) {
        container.innerHTML = '<p style="color:var(--text-muted); text-align:center;">User not found!</p>';
        return;
      }

      const row = document.createElement('div');
      row.className = 'user-row';
      row.innerHTML = `
        <div style="display:flex; align-items:center; gap:12px;">
          <div class="avatar">${target[0].toUpperCase()}</div>
          <div><strong>${target}</strong></div>
        </div>
        <button class="btn-sm" onclick="sendFollowRequest('${target}')">Send Follow Request</button>
      `;
      container.appendChild(row);
    });
  }

  function sendFollowRequest(target) {
    gun.get('instap2p_v2_requests').get(target).get(currentUser).put({
      from: currentUser,
      status: 'pending',
      timestamp: Date.now()
    });
    alert(`Follow request sent to @${target}!`);
  }

  function listenToFollowRequests() {
    const badge = document.getElementById('requests-badge');
    const container = document.getElementById('requests-list');

    gun.get('instap2p_v2_requests').get(currentUser).map().on((req, fromUser) => {
      if (!req || req.status !== 'pending') return;

      badge.style.display = 'inline-block';
      badge.innerText = parseInt(badge.innerText || '0') + 1;

      if (!document.getElementById('req-' + fromUser)) {
        const row = document.createElement('div');
        row.id = 'req-' + fromUser;
        row.className = 'user-row';
        row.innerHTML = `
          <div style="display:flex; align-items:center; gap:10px;">
            <div class="avatar">${fromUser[0].toUpperCase()}</div>
            <div><strong>${fromUser}</strong> wants to follow you</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn-sm" onclick="acceptFollowRequest('${fromUser}')">Accept</button>
          </div>
        `;
        container.appendChild(row);
      }
    });
  }

  function acceptFollowRequest(fromUser) {
    gun.get('instap2p_v2_requests').get(currentUser).get(fromUser).update({ status: 'accepted' });
    gun.get('instap2p_v2_friends').get(currentUser).get(fromUser).put(true);
    gun.get('instap2p_v2_friends').get(fromUser).get(currentUser).put(true);

    const row = document.getElementById('req-' + fromUser);
    if (row) row.remove();

    alert(`Accepted follow request from @${fromUser}!`);
    loadChatList();
  }

  // 5. POST CREATION & MEDIA PROCESSING
  function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    selectedFileType = file.type.startsWith('video') ? 'video' : 'image';
    const reader = new FileReader();

    reader.onload = function(e) {
      selectedFileBase64 = e.target.result;
      const preview = document.getElementById('preview-container');
      preview.style.display = 'block';

      if (selectedFileType === 'image') {
        preview.innerHTML = `<img src="${selectedFileBase64}" />`;
      } else {
        preview.innerHTML = `<video src="${selectedFileBase64}" controls></video>`;
      }
    };

    reader.readAsDataURL(file);
  }

  function publishPost() {
    const caption = document.getElementById('post-caption-input').value;
    if (!selectedFileBase64) return alert("Please select an image or video reel first!");

    const postId = 'post_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);

    const postObj = {
      id: postId,
      author: currentUser,
      caption: caption,
      media: selectedFileBase64,
      mediaType: selectedFileType,
      likes: 0,
      timestamp: Date.now()
    };

    gun.get('instap2p_v2_posts').get(postId).put(postObj);
    gun.get('instap2p_v2_user_posts').get(currentUser).get(postId).put(postObj);

    alert("Post shared successfully!");

    document.getElementById('post-caption-input').value = '';
    document.getElementById('preview-container').style.display = 'none';
    selectedFileBase64 = null;

    switchTab('feed');
  }

  // 6. REALTIME FEED ENGINE
  function listenToFeed() {
    const container = document.getElementById('feed-container');

    gun.get('instap2p_v2_posts').map().on((post, id) => {
      if (!post || !post.media) return;

      let postEl = document.getElementById(id);
      if (!postEl) {
        postEl = document.createElement('div');
        postEl.id = id;
        postEl.className = 'post-card';
        container.prepend(postEl);
      }

      const mediaHtml = post.mediaType === 'video'
        ? `<video src="${post.media}" class="post-media" controls autoplay loop muted></video>`
        : `<img src="${post.media}" class="post-media" />`;

      postEl.innerHTML = `
        <div class="post-header">
          <div class="avatar">${post.author ? post.author[0].toUpperCase() : 'U'}</div>
          <div class="post-username">${post.author}</div>
        </div>
        ${mediaHtml}
        <div class="post-actions">
          <i data-feather="heart" class="action-icon" onclick="likePost('${id}')"></i>
          <i data-feather="message-circle" class="action-icon"></i>
        </div>
        <div class="post-likes" id="likes-${id}">${post.likes || 0} likes</div>
        <div class="post-caption"><span>${post.author}</span>${post.caption || ''}</div>
        <div class="post-comments" id="comments-${id}"></div>
        <div style="display:flex; padding: 0 14px 12px; gap:8px;">
          <input type="text" id="input-comment-${id}" class="auth-input" style="padding:8px 12px; font-size:0.85rem;" placeholder="Add a comment..." />
          <button class="btn-sm" onclick="addComment('${id}')">Post</button>
        </div>
      `;

      feather.replace();
      listenToComments(id);
    });
  }

  function likePost(postId) {
    const postRef = gun.get('instap2p_v2_posts').get(postId);
    postRef.get('likes').once((currentLikes) => {
      postRef.update({ likes: (currentLikes || 0) + 1 });
    });
  }

  function addComment(postId) {
    const input = document.getElementById(`input-comment-${postId}`);
    const text = input.value.trim();
    if (!text) return;

    gun.get('instap2p_v2_comments').get(postId).set({
      author: currentUser,
      text: text,
      timestamp: Date.now()
    });

    input.value = '';
  }

  function listenToComments(postId) {
    const commentBox = document.getElementById(`comments-${postId}`);
    if (!commentBox) return;

    gun.get('instap2p_v2_comments').get(postId).map().on((comment) => {
      if (!comment) return;
      const cId = 'c_' + comment.timestamp;
      if (!document.getElementById(cId)) {
        const item = document.createElement('div');
        item.id = cId;
        item.className = 'comment-item';
        item.innerHTML = `<strong>${comment.author}</strong>${comment.text}`;
        commentBox.appendChild(item);
      }
    });
  }

  // 7. DIRECT MESSAGING & PROFILE
  function setupProfile() {
    document.getElementById('profile-name').innerText = currentUser;
    document.getElementById('profile-handle').innerText = '@' + currentUser;
    document.getElementById('profile-avatar').innerText = currentUser[0].toUpperCase();

    const myGrid = document.getElementById('my-posts-grid');
    myGrid.innerHTML = '';
    gun.get('instap2p_v2_user_posts').get(currentUser).map().on((post) => {
      if (!post || !post.media) return;
      const thumb = document.createElement('div');
      thumb.style.aspectRatio = '1';
      thumb.style.borderRadius = '8px';
      thumb.style.overflow = 'hidden';
      thumb.style.background = '#222';
      thumb.innerHTML = post.mediaType === 'video'
        ? `<video src="${post.media}" style="width:100%; height:100%; object-fit:cover;"></video>`
        : `<img src="${post.media}" style="width:100%; height:100%; object-fit:cover;" />`;
      myGrid.appendChild(thumb);
    });

    loadChatList();
  }

  function loadChatList() {
    const chatList = document.getElementById('chat-friends-list');
    chatList.innerHTML = '';

    gun.get('instap2p_v2_friends').get(currentUser).map().on((isFriend, friendName) => {
      if (!isFriend || document.getElementById('chat-row-' + friendName)) return;

      const row = document.createElement('div');
      row.id = 'chat-row-' + friendName;
      row.className = 'user-row';
      row.style.cursor = 'pointer';
      row.onclick = () => openChat(friendName);
      row.innerHTML = `
        <div style="display:flex; align-items:center; gap:12px;">
          <div class="avatar">${friendName[0].toUpperCase()}</div>
          <div><strong>${friendName}</strong></div>
        </div>
        <i data-feather="chevron-right"></i>
      `;
      chatList.appendChild(row);
      feather.replace();
    });
  }

  function openChat(friendUsername) {
    activeChatTarget = friendUsername;
    document.getElementById('chat-target-name').innerText = friendUsername;
    document.getElementById('chat-target-avatar').innerText = friendUsername[0].toUpperCase();
    document.getElementById('chat-messages').innerHTML = '';
    document.getElementById('chat-window').classList.add('active');

    gun.get('instap2p_v2_chats').get(currentUser).get(activeChatTarget).map().on((msg) => {
      if (!msg) return;
      renderMessage(msg.text, msg.sender === currentUser ? 'sent' : 'received');
    });

    activeDataConnection = currentPeer.connect('instap2p-' + friendUsername);
  }

  function closeChat() {
    document.getElementById('chat-window').classList.remove('active');
  }

  function sendDirectMessage() {
    const input = document.getElementById('chat-msg-input');
    const text = input.value.trim();
    if (!text || !activeChatTarget) return;

    const msgData = { sender: currentUser, text: text, timestamp: Date.now() };

    if (activeDataConnection && activeDataConnection.open) {
      activeDataConnection.send(msgData);
    }

    gun.get('instap2p_v2_chats').get(currentUser).get(activeChatTarget).set(msgData);
    gun.get('instap2p_v2_chats').get(activeChatTarget).get(currentUser).set(msgData);

    input.value = '';
  }

  function renderMessage(text, type) {
    const box = document.getElementById('chat-messages');
    const msgEl = document.createElement('div');
    msgEl.className = `msg ${type}`;
    msgEl.innerText = text;
    box.appendChild(msgEl);
    box.scrollTop = box.scrollHeight;
  }
</script>
</body>
</html>
