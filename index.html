<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaP2P - Pure Jugaad Serverless Social</title>
  
  <!-- CDN Libraries: GunDB (P2P DB) & PeerJS (WebRTC Direct Channels) -->
  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gun/sea.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons"></script>

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --border-color: #262626;
      --text-color: #f5f5f5;
      --muted-text: #a8a8a8;
      --accent-color: #0095f6;
      --like-color: #ff3040;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; height: 100vh; overflow: hidden; }

    #app-container { width: 100%; max-width: 470px; height: 100vh; display: flex; flex-direction: column; background-color: #000; border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); position: relative; }

    /* AUTH MODAL */
    .auth-overlay { position: absolute; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; }
    .auth-overlay h1 { font-size: 2.2rem; margin-bottom: 25px; font-style: italic; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .auth-form { width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .auth-input { width: 100%; padding: 14px; background: #121212; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; outline: none; }
    .auth-btn { width: 100%; padding: 12px; background: var(--accent-color); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* HEADER */
    header { height: 60px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #000; z-index: 10; }
    header h2 { font-style: italic; font-size: 1.5rem; }

    /* MAIN VIEWPORT */
    main { flex: 1; overflow-y: auto; padding-bottom: 70px; scrollbar-width: none; }
    main::-webkit-scrollbar { display: none; }

    /* FEED POST */
    .post-card { border-bottom: 1px solid var(--border-color); margin-bottom: 15px; }
    .post-header { display: flex; align-items: center; padding: 10px 14px; gap: 10px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(45deg, #f09433, #bc1888); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; text-transform: uppercase; color: #fff; }
    .post-username { font-weight: 600; font-size: 0.95rem; }
    .post-media { width: 100%; max-height: 470px; background: #050505; object-fit: contain; display: block; }
    .post-actions { display: flex; gap: 16px; padding: 10px 14px; }
    .action-icon { cursor: pointer; transition: transform 0.1s; }
    .action-icon:active { transform: scale(0.85); }
    .action-icon.liked { color: var(--like-color); fill: var(--like-color); }
    .post-likes { padding: 0 14px; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    .post-caption { padding: 0 14px 10px 14px; font-size: 0.9rem; word-break: break-word; }
    .post-caption span { font-weight: 600; margin-right: 6px; }

    /* COMMENTS SECTION */
    .post-comments { padding: 0 14px 10px; font-size: 0.85rem; color: var(--muted-text); }
    .comment-item { margin-top: 4px; color: var(--text-color); }
    .comment-item strong { margin-right: 5px; }

    /* BOTTOM NAV */
    nav { height: 50px; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; background: #000; position: absolute; bottom: 0; width: 100%; z-index: 10; }
    nav .nav-item { cursor: pointer; color: var(--muted-text); }
    nav .nav-item.active { color: var(--text-color); }

    /* PANELS (SEARCH, CREATE, CHAT, PROFILE) */
    .panel { display: none; padding: 16px; height: 100%; }
    .panel.active { display: block; }

    /* SEARCH PANEL */
    .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
    .search-results { display: flex; flex-direction: column; gap: 12px; }
    .user-row { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px; border-radius: 8px; }

    /* CREATE POST PANEL */
    .create-form { display: flex; flex-direction: column; gap: 15px; }
    .file-input-label { border: 2px dashed var(--border-color); padding: 30px; text-align: center; border-radius: 8px; cursor: pointer; color: var(--muted-text); }
    #preview-container { width: 100%; max-height: 250px; overflow: hidden; border-radius: 8px; display: none; }
    #preview-container img, #preview-container video { width: 100%; height: 100%; object-fit: cover; }

    /* CHAT PANEL */
    .chat-list { display: flex; flex-direction: column; gap: 10px; }
    .chat-window { display: none; flex-direction: column; height: 100%; position: absolute; inset: 0; background: #000; z-index: 20; }
    .chat-window.active { display: flex; }
    .chat-header { padding: 12px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 18px; font-size: 0.9rem; word-break: break-word; }
    .msg.sent { align-self: flex-end; background: var(--accent-color); color: #fff; }
    .msg.received { align-self: flex-start; background: var(--card-bg); color: #fff; }
    .chat-input-bar { padding: 10px; border-top: 1px solid var(--border-color); display: flex; gap: 8px; }

    /* BUTTONS */
    .btn-sm { padding: 6px 12px; background: var(--accent-color); border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
    .btn-secondary { background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color); }
  </style>
</head>
<body>

<div id-="app-container">
  
  <!-- AUTH MODAL -->
  <div class="auth-overlay" id="auth-modal">
    <h1>Instagram P2P</h1>
    <div class="auth-form">
      <input type="text" id="username-input" class="auth-input" placeholder="Choose unique username..." />
      <input type="password" id="password-input" class="auth-input" placeholder="Password (for key derivation)..." />
      <button class="auth-btn" onclick="registerOrLogin()">Enter / Register ID</button>
      <p id="auth-error" style="color:red; font-size:0.8rem; text-align:center; display:none;">Name taken or invalid!</p>
    </div>
  </div>

  <!-- HEADER -->
  <header>
    <h2>Instagram</h2>
    <div style="display:flex; gap:12px;">
      <i data-feather="heart" class="action-icon"></i>
      <i data-feather="send" class="action-icon" onclick="switchTab('chats')"></i>
    </div>
  </header>

  <!-- MAIN CONTENT AREA -->
  <main id="main-content">
    
    <!-- FEED VIEW -->
    <div id="feed-panel" class="panel active">
      <div id="feed-container">
        <!-- Dynamic posts stream here -->
      </div>
    </div>

    <!-- SEARCH PANEL -->
    <div id="search-panel" class="panel">
      <div class="search-box">
        <input type="text" id="search-username" class="auth-input" placeholder="Search exact username..." />
        <button class="btn-sm" onclick="searchUser()">Search</button>
      </div>
      <div class="search-results" id="search-results"></div>
    </div>

    <!-- CREATE POST PANEL -->
    <div id="create-panel" class="panel">
      <div class="create-form">
        <label class="file-input-label" for="post-file">
          <i data-feather="upload-cloud" style="width:32px; height:32px;"></i>
          <p>Click to select Image or Video Reel</p>
        </label>
        <input type="file" id="post-file" accept="image/*,video/*" style="display:none;" onchange="handleFileSelect(event)">
        
        <div id="preview-container"></div>

        <input type="text" id="post-caption-input" class="auth-input" placeholder="Write a caption..." />
        <button class="auth-btn" onclick="publishPost()">Share Post</button>
      </div>
    </div>

    <!-- CHAT PANEL -->
    <div id="chats-panel" class="panel">
      <h3 style="margin-bottom:15px;">Direct Messages</h3>
      <div class="chat-list" id="chat-friends-list"></div>
    </div>

    <!-- PROFILE PANEL -->
    <div id="profile-panel" class="panel">
      <div style="display:flex; align-items:center; gap:20px; margin-bottom:20px;">
        <div class="avatar" id="profile-avatar" style="width:70px; height:70px; font-size:1.8rem;">U</div>
        <div>
          <h3 id="profile-name">Username</h3>
          <p style="color:var(--muted-text); font-size:0.85rem;" id="profile-peer-id">ID: ...</p>
        </div>
      </div>
      <h4>My Shared Posts</h4>
      <div id="my-posts-grid" style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:4px; margin-top:10px;"></div>
    </div>

  </main>

  <!-- CHAT WINDOW OVERLAY -->
  <div class="chat-window" id="chat-window">
    <div class="chat-header">
      <i data-feather="arrow-left" class="action-icon" onclick="closeChat()"></i>
      <div class="avatar" id="chat-target-avatar">F</div>
      <strong id="chat-target-name">Friend</strong>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-bar">
      <input type="text" id="chat-msg-input" class="auth-input" placeholder="Message..." />
      <button class="btn-sm" onclick="sendDirectMessage()">Send</button>
    </div>
  </div>

  <!-- NAVIGATION -->
  <nav>
    <div class="nav-item active" onclick="switchTab('feed', this)"><i data-feather="home"></i></div>
    <div class="nav-item" onclick="switchTab('search', this)"><i data-feather="search"></i></div>
    <div class="nav-item" onclick="switchTab('create', this)"><i data-feather="plus-square"></i></div>
    <div class="nav-item" onclick="switchTab('chats', this)"><i data-feather="message-circle"></i></div>
    <div class="nav-item" onclick="switchTab('profile', this)"><i data-feather="user"></i></div>
  </nav>

</div>

<script>
  // Initialize Decentralized GunDB Graph Node
  const gun = Gun({
    peers: ['https://gun-manhattan.herokuapp.com/gun', 'https://peer.wallrpc.com/gun'] // Public Relay Nodes
  });

  let currentUser = null;
  let currentPeer = null;
  let selectedFileBase64 = null;
  let selectedFileType = null;
  let activeChatTarget = null;
  let activeDataConnection = null;

  feather.replace();

  // 1. UNIQUE USER REGISTRATION & AUTH
  function registerOrLogin() {
    const name = document.getElementById('username-input').value.trim().toLowerCase();
    const pass = document.getElementById('password-input').value.trim();

    if (!name || !pass) return alert("Enter both username and password!");

    const userRegistry = gun.get('insta_p2p_users').get(name);

    userRegistry.once((data) => {
      if (data && data.passHash !== btoa(pass)) {
        document.getElementById('auth-error').innerText = "Username taken with different password!";
        document.getElementById('auth-error').style.display = 'block';
        return;
      }

      // Claim or login successfully
      userRegistry.put({ username: name, passHash: btoa(pass), joined: Date.now() });
      currentUser = name;

      // Initialize WebRTC Direct Peer Channel
      initPeerJS(name);

      // Save locally
      localStorage.setItem('insta_p2p_user', name);
      document.getElementById('auth-modal').style.display = 'none';
      setupProfile();
      listenToFeed();
    });
  }

  // Auto Login Check
  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('insta_p2p_user');
    if (saved) {
      currentUser = saved;
      document.getElementById('auth-modal').style.display = 'none';
      initPeerJS(saved);
      setupProfile();
      listenToFeed();
    }
  });

  // 2. WEBRTC DIRECT PEER INITIALIZATION
  function initPeerJS(username) {
    currentPeer = new Peer('instap2p-' + username);

    currentPeer.on('open', (id) => {
      document.getElementById('profile-peer-id').innerText = `@${username}`;
    });

    // Listen for incoming direct messages/file streams
    currentPeer.on('connection', (conn) => {
      conn.on('data', (data) => {
        handleIncomingP2PData(data, conn.peer);
      });
    });
  }

  // 3. TAB SWITCHING
  function switchTab(tabId, el) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    
    document.getElementById(tabId + '-panel').classList.add('active');
    if (el) el.classList.add('active');
  }

  // 4. SEARCH & FOLLOW REQUEST SYSTEM
  function searchUser() {
    const target = document.getElementById('search-username').value.trim().toLowerCase();
    const resultsContainer = document.getElementById('search-results');
    resultsContainer.innerHTML = '';

    if (!target) return;

    gun.get('insta_p2p_users').get(target).once((data) => {
      if (!data) {
        resultsContainer.innerHTML = '<p style="color:var(--muted-text)">User not found!</p>';
        return;
      }

      const row = document.createElement('div');
      row.className = 'user-row';
      row.innerHTML = `
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="avatar">${target[0]}</div>
          <div><strong>${target}</strong></div>
        </div>
        <button class="btn-sm" onclick="sendFollowRequest('${target}')">Follow Request</button>
      `;
      resultsContainer.appendChild(row);
    });
  }

  function sendFollowRequest(target) {
    gun.get('insta_p2p_requests').get(target).get(currentUser).put({
      from: currentUser,
      status: 'pending',
      timestamp: Date.now()
    });
    alert(`Follow Request sent to @${target}!`);
  }

  // 5. POST CREATION & MEDIA PROCESSING
  function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    selectedFileType = file.type.startsWith('video') ? 'video' : 'image';
    const reader = new FileReader();

    reader.onload = function(e) {
      selectedFileBase64 = e.target.result;
      const preview = document.getElementById('preview-container');
      preview.style.display = 'block';

      if (selectedFileType === 'image') {
        preview.innerHTML = `<img src="${selectedFileBase64}" />`;
      } else {
        preview.innerHTML = `<video src="${selectedFileBase64}" controls></video>`;
      }
    };

    reader.readAsDataURL(file);
  }

  function publishPost() {
    const caption = document.getElementById('post-caption-input').value;
    if (!selectedFileBase64) return alert("Select an image or reel video first!");

    const postId = 'post_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
    
    const postObj = {
      id: postId,
      author: currentUser,
      caption: caption,
      media: selectedFileBase64,
      mediaType: selectedFileType,
      likes: 0,
      timestamp: Date.now()
    };

    // Save to Graph Network
    gun.get('insta_p2p_posts').get(postId).put(postObj);
    gun.get('insta_p2p_user_posts').get(currentUser).get(postId).put(postObj);

    alert("Post published successfully!");
    
    // Reset inputs
    document.getElementById('post-caption-input').value = '';
    document.getElementById('preview-container').style.display = 'none';
    selectedFileBase64 = null;
    
    switchTab('feed');
  }

  // 6. REALTIME FEED ENGINE
  function listenToFeed() {
    const container = document.getElementById('feed-container');
    
    gun.get('insta_p2p_posts').map().on((post, id) => {
      if (!post || !post.media) return;

      let postEl = document.getElementById(id);
      if (!postEl) {
        postEl = document.createElement('div');
        postEl.id = id;
        postEl.className = 'post-card';
        container.prepend(postEl);
      }

      const mediaHtml = post.mediaType === 'video' 
        ? `<video src="${post.media}" class="post-media" controls autoplay loop muted></video>`
        : `<img src="${post.media}" class="post-media" />`;

      postEl.innerHTML = `
        <div class="post-header">
          <div class="avatar">${post.author ? post.author[0] : 'U'}</div>
          <div class="post-username">${post.author}</div>
        </div>
        ${mediaHtml}
        <div class="post-actions">
          <i data-feather="heart" class="action-icon" onclick="likePost('${id}')"></i>
          <i data-feather="message-circle" class="action-icon"></i>
        </div>
        <div class="post-likes" id="likes-${id}">${post.likes || 0} likes</div>
        <div class="post-caption"><span>${post.author}</span>${post.caption || ''}</div>
        <div class="post-comments" id="comments-${id}"></div>
        <div style="display:flex; padding: 0 14px 10px; gap:8px;">
          <input type="text" id="input-comment-${id}" class="auth-input" style="padding:6px; font-size:0.8rem;" placeholder="Add a comment..." />
          <button class="btn-sm" onclick="addComment('${id}')">Post</button>
        </div>
      `;

      feather.replace();
      listenToComments(id);
    });
  }

  function likePost(postId) {
    const postRef = gun.get('insta_p2p_posts').get(postId);
    postRef.get('likes').once((currentLikes) => {
      postRef.update({ likes: (currentLikes || 0) + 1 });
    });
  }

  function addComment(postId) {
    const input = document.getElementById(`input-comment-${postId}`);
    const text = input.value.trim();
    if (!text) return;

    gun.get('insta_p2p_comments').get(postId).set({
      author: currentUser,
      text: text,
      timestamp: Date.now()
    });

    input.value = '';
  }

  function listenToComments(postId) {
    const commentBox = document.getElementById(`comments-${postId}`);
    if (!commentBox) return;

    gun.get('insta_p2p_comments').get(postId).map().on((comment) => {
      if (!comment) return;
      const cId = 'c_' + comment.timestamp;
      if (!document.getElementById(cId)) {
        const item = document.createElement('div');
        item.id = cId;
        item.className = 'comment-item';
        item.innerHTML = `<strong>${comment.author}</strong>${comment.text}`;
        commentBox.appendChild(item);
      }
    });
  }

  // 7. DIRECT MESSAGING (P2P + Offline Relay)
  function setupProfile() {
    document.getElementById('profile-name').innerText = currentUser;
    document.getElementById('profile-avatar').innerText = currentUser[0].toUpperCase();

    // Render my posts
    const myGrid = document.getElementById('my-posts-grid');
    gun.get('insta_p2p_user_posts').get(currentUser).map().on((post) => {
      if (!post || !post.media) return;
      const thumb = document.createElement('div');
      thumb.style.aspectRatio = '1';
      thumb.style.background = '#222';
      thumb.innerHTML = post.mediaType === 'video'
        ? `<video src="${post.media}" style="width:100%; height:100%; object-fit:cover;"></video>`
        : `<img src="${post.media}" style="width:100%; height:100%; object-fit:cover;" />`;
      myGrid.appendChild(thumb);
    });

    loadChatList();
  }

  function loadChatList() {
    const chatList = document.getElementById('chat-friends-list');
    chatList.innerHTML = '';

    // Simple chat discovery (Listen to messages stored for current user)
    gun.get('insta_p2p_chats').get(currentUser).map().on((msg, friend) => {
      if (!document.getElementById('chat-row-' + friend)) {
        const row = document.createElement('div');
        row.id = 'chat-row-' + friend;
        row.className = 'user-row';
        row.onclick = () => openChat(friend);
        row.innerHTML = `
          <div style="display:flex; align-items:center; gap:10px;">
            <div class="avatar">${friend[0]}</div>
            <div><strong>${friend}</strong></div>
          </div>
          <i data-feather="chevron-right"></i>
        `;
        chatList.appendChild(row);
        feather.replace();
      }
    });
  }

  function openChat(friendUsername) {
    activeChatTarget = friendUsername;
    document.getElementById('chat-target-name').innerText = friendUsername;
    document.getElementById('chat-target-avatar').innerText = friendUsername[0].toUpperCase();
    document.getElementById('chat-messages').innerHTML = '';
    document.getElementById('chat-window').classList.add('active');

    // Load persistent store
    gun.get('insta_p2p_chats').get(currentUser).get(activeChatTarget).map().on((msg) => {
      if (!msg) return;
      renderMessage(msg.text, msg.sender === currentUser ? 'sent' : 'received');
    });

    // Establish active WebRTC Data Channel if online
    activeDataConnection = currentPeer.connect('instap2p-' + friendUsername);
  }

  function closeChat() {
    document.getElementById('chat-window').classList.remove('active');
  }

  function sendDirectMessage() {
    const input = document.getElementById('chat-msg-input');
    const text = input.value.trim();
    if (!text || !activeChatTarget) return;

    const msgData = { sender: currentUser, text: text, timestamp: Date.now() };

    // Send via WebRTC if connected directly
    if (activeDataConnection && activeDataConnection.open) {
      activeDataConnection.send(msgData);
    }

    // Sync to GunDB Graph (Offline access guarantee)
    gun.get('insta_p2p_chats').get(currentUser).get(activeChatTarget).set(msgData);
    gun.get('insta_p2p_chats').get(activeChatTarget).get(currentUser).set(msgData);

    input.value = '';
  }

  function handleIncomingP2PData(data, senderPeerId) {
    if (data.text) {
      renderMessage(data.text, 'received');
    }
  }

  function renderMessage(text, type) {
    const box = document.getElementById('chat-messages');
    const msgEl = document.createElement('div');
    msgEl.className = `msg ${type}`;
    msgEl.innerText = text;
    box.appendChild(msgEl);
    box.scrollTop = box.scrollHeight;
  }
</script>
</body>
</html>
